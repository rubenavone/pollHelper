<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Sondage Mattermost</title>
    <!-- Tailwind CSS pour un design propre et rapide -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-xl bg-white shadow-xl rounded-2xl p-6 sm:p-8">
        <h1 class="text-2xl font-bold text-indigo-600 mb-2">📊 Générateur de Poll Mattermost</h1>
        <p class="text-sm text-slate-500 mb-6">Créez facilement vos sondages pour Mattermost en remplissant les champs ci-dessous.</p>

        <!-- Formulaire -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1" for="question">Question du sondage</label>
                <input type="text" id="question" placeholder="Ex: On mange quoi à midi ?" 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Options de réponse</label>
                <div id="options-container" class="space-y-2">
                    <div class="flex gap-2">
                        <input type="text" placeholder="Option 1" class="option-input w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div class="flex gap-2">
                        <input type="text" placeholder="Option 2" class="option-input w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
                <button onclick="addOption()" class="mt-2 text-sm text-indigo-600 font-semibold hover:underline flex items-center gap-1">
                    + Ajouter une option
                </button>
            </div>

            <button onclick="generatePoll()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                Générer la commande
            </button>
        </div>

        <!-- Résultat -->
        <div id="result-section" class="mt-8 hidden">
            <h2 class="text-sm font-semibold text-slate-700 mb-2">Commande Mattermost générée :</h2>
            <div class="relative">
                <textarea id="output" readonly rows="4" 
                    class="w-full p-3 bg-slate-100 border border-slate-200 rounded-lg font-mono text-sm text-slate-700 focus:outline-none"></textarea>
            </div>
            <button onclick="copyToClipboard()" id="copy-btn" class="mt-3 w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2 rounded-lg transition duration-200 text-sm">
                Copier dans le presse-papier
            </button>
        </div>
    </div>

    <script>
        function addOption() {
            const container = document.getElementById('options-container');
            const count = container.children.length + 1;
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center';
            div.innerHTML = `
                <input type="text" placeholder="Option ${count}" class="option-input w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 font-bold px-2">×</button>
            `;
            container.appendChild(div);
        }

        function generatePoll() {
            const question = document.getElementById('question').value.trim();
            const optionInputs = document.querySelectorAll('.option-input');
            const options = Array.from(optionInputs).map(input => input.value.trim()).filter(Boolean);

            if (!question) {
                alert('Veuillez entrer une question.');
                return;
            }
            if (options.length < 2) {
                alert('Veuillez entrer au moins 2 options.');
                return;
            }

            // Syntaxe standard du plugin /poll de Mattermost : /poll "Question" "Option1" "Option2" ...
            let command = `/poll "${question}"`;
            options.forEach(opt => {
                command += ` "${opt}"`;
            });

            document.getElementById('output').value = command;
            document.getElementById('result-section').classList.remove('hidden');
        }

        function copyToClipboard() {
            const output = document.getElementById('output');
            output.select();
            document.execCommand('copy');
            
            const btn = document.getElementById('copy-btn');
            const originalText = btn.innerText;
            btn.innerText = 'Copié ! 👍';
            btn.classList.add('bg-green-600');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('bg-green-600');
            }, 2000);
        }
    </script>
</body>
</html>
